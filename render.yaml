services:
  - type: web
    name: kisansaathi
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATA_GOV_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
